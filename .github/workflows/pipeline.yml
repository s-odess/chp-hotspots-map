name: 24-7 CHP Live Telemetry Pipeline

on:
  schedule:
    # Runs 6 times a day: Midnight, 4 AM, 8 AM, Noon, 4 PM, 8 PM UTC
    # Distributes your 20 free-tier daily requests perfectly across 24 hours!
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch: # Keeps the manual "Run workflow" button active for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai python-dotenv requests playwright beautifulsoup4

    - name: Install Playwright Web Browser Binaries
      run: playwright install chromium --with-deps

    - name: Run CHP Scraping Engine
      run: python chp_hotspots_engine.py

    - name: Run Gemini Summary Translation Agent
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        GITHUB_REPO: "s-odess/chp-hotspots-map"
      run: python -u agent.py